services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [media:/srv/deals-ai/backend/media]
    command: ["sh","/srv/deals-ai/scripts/entrypoint.sh","gunicorn","config.wsgi:application","--bind","0.0.0.0:8000","--workers","2","--timeout","90"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [media:/srv/deals-ai/backend/media]
    command: ["celery","-A","config","worker","--loglevel=INFO","--concurrency=2"]
    restart: unless-stopped
  beat:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["celery","-A","config","beat","--loglevel=INFO"]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    depends_on: [web]
    ports: ["8080:80"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  media:
